<!doctype html>
<html lang="es">

{% include 'plantillas/_default_head.html' %}
<!--http://127.0.0.1:5001/productos para correr productos -->
<!--correr con control + ñ y despues ingresar python app.py para que ande -->

<body>
  <header class="topbar">
    <div class="topbar__brand">
      {% include 'plantillas/_logo.html' %}
      <span class="topbar__view-tag" id="viewTag">Vista Metodos de Pago</span>
    </div>
    <div class="topbar__user" title="Usuario">A</div>
  </header>

  {% include 'plantillas/_navbar.html' %}

  <main class="app">
    <section class="panel active" id="panel-metodos_pago" data-title="metodos_pago">
      <div class="panel__header">
        <h1>Métodos de Pago</h1>
      </div>
      <div class="panel__body">
        <div class="table-wrap">
          <table class="data-table" data-entity="metodos_pago">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              {% for MP in metodos_pago %}
              <tr>
                <td>{{ MP[0] }}</td>
                <td>{{ MP[1] }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>

        <form class="entity-form" id="formMetodosPago" data-entity="Metodo_Pago">
          <div class="field">
            <label for="mp-id">ID Método de Pago</label>
            <input type="number" id="mp-id" name="id_metodo_pago" placeholder="1" required />
          </div>
          <div class="field">
            <label for="mp-nombre">Nombre</label>
            <input type="text" id="mp-nombre" name="nombre" placeholder="Nombre del método de pago" required />
          </div>
          <div class="field">
            <label for="mp-estado">Estado</label>
            <input type="number" id="mp-estado" name="id_estado" placeholder="1 = Activo, 2 = Inactivo" required />
          </div>

          <div class="form-actions">
            <button type="button" id="btnAgregar" class="btn btn--primary">
              Agregar
            </button>
            <button type="button" id="btnActualizar" class="btn btn--secondary">
              Actualizar
            </button>
            <button type="button" id="btnEliminar" class="btn-icon btn-delete">
              Eliminar
            </button>
          </div>
        </form>


      </div>
    </section>
  </main>

  <script>
    const URL_API = 'http://127.0.0.1:5001/api/metodos_pago'

    function obtenerDatosFormulario() {
      return {
        id_metodo_pago: parseInt(document.getElementById('mp-id').value),
        nombre: document.getElementById('mp-nombre').value,
        id_estado: parseInt(document.getElementById('mp-estado').value),
      }
    }

    document
      .getElementById('btnAgregar')
      .addEventListener('click', async () => {
        const datos = obtenerDatosFormulario()
        if (!datos.id_metodo_pago || !datos.nombre || !datos.id_estado)
          return alert('Por favor, llena los campos requeridos.')

        try {
          const respuesta = await fetch(`${URL_API}/guardar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
          })
          const resultado = await respuesta.json()

          alert(resultado.message)
          if (respuesta.ok) {
            document.getElementById('formMetodosPago').reset()
            location.reload()
          }
        } catch (error) {
          alert(
            'No se pudo conectar con el servidor de Flask en el puerto 5001.',
          )
        }
      })

    document
      .getElementById('btnActualizar')
      .addEventListener('click', async () => {
        const datos = obtenerDatosFormulario()
        if (!datos.id_metodo_pago)
          return alert('Especifica el ID del método de pago a actualizar.')

        try {
          const respuesta = await fetch(`${URL_API}/actualizar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
          })
          const resultado = await respuesta.json()

          alert(resultado.message)
          if (respuesta.ok) {
            document.getElementById('formMetodosPago').reset()
            location.reload()
          }
        } catch (error) {
          alert(
            'No se pudo conectar con el servidor de Flask en el puerto 5001.',
          )
        }
      })

    document
      .getElementById('btnEliminar')
      .addEventListener('click', async () => {
        const datos = obtenerDatosFormulario()
        if (!datos.id_metodo_pago)
          return alert('Especifica el ID del método de pago a eliminar.')

        try {
          const respuesta = await fetch(
            `${URL_API}/eliminar/${datos.id_metodo_pago}`,
            {
              method: 'POST',
            },
          )
          const resultado = await respuesta.json()

          alert(resultado.message)
          if (respuesta.ok) {
            document.getElementById('formMetodosPago').reset()
            location.reload()
          }
        } catch (error) {
          alert(
            'No se pudo conectar con el servidor de Flask en el puerto 5001.',
          )
        }
      })
  </script>

  {% include 'plantillas/_default_scripts.html' %}
</body>

</html>
