{# LISTENER DE BUSCADOR #}
<script>
    document.addEventListener('input', (event) => {
        // Escucha eventos en inputs que tengan el atributo 'data-filter-target'
        if (event.target.matches('[data-filter-target]')) {
            const targetEntity = event.target.getAttribute('data-filter-target');
            const texto = event.target.value.toLowerCase();
            const filas = document.querySelectorAll(`table[data-entity="${targetEntity}"] tbody tr`);

            filas.forEach((fila) => {
                const coincide = fila.textContent.toLowerCase().includes(texto);
                fila.style.display = coincide ? '' : 'none';
            });
        }
    });
</script>

{# FUNCION DE ELIMINAR FILA #}
<script>
    function deleteRow(button) {
        const row = button.closest('tr');
        const id = row.getAttribute('data-id');
        const entity = row.getAttribute('data-entity');

        Swal.fire({
            title: '¿Estás seguro?',
            text: "¡No podrás revertir esta acción!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc3545', // Rojo peligro
            cancelButtonColor: '#6c757d',  // Gris secundario
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                fetch(`/delete/${entity}/${id}`, {
                    method: 'POST',
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            row.remove();
                            Swal.fire('¡Eliminado!', 'El registro ha sido eliminado con éxito.', 'success');
                        } else {
                            Swal.fire('Error', data.message, 'error');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        Swal.fire('Error', 'Ocurrió un problema al procesar la solicitud.', 'error');
                    });
            }
        });
    }
</script>
