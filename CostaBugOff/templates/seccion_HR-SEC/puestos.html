<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CostaBugOff</title>
  <link rel="stylesheet" href="/static/css/styles.css" alt="foto Jeremy" />
</head>

<body>
  <header class="topbar">
    <div class="topbar__brand">
      <div class="JeremyLogo">

      </div>

      <img class="logo-bug" src="/static/img/Jeremy.png" alt="" />
      <span class="topbar__logo">CostaBugOff</span>

      <span class="topbar__view-tag" id="viewTag">Vista Puestos</span>
    </div>
    <div class="topbar__user" title="Usuario">A</div>
  </header>

  {% include 'plantillas/_navbar.html' %}

  <main class="app">
    <section class="panel active" id="panel-puestos" data-title="Puestos">
      <div class="panel__header">
        <h1>Puestos</h1>
      </div>
      <div class="panel__body">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <form method="get" class="filtro-form">
            <label for="filtro-estado">Filtrar por estado:</label>
            <select name="estado" s id="filtro-estado" onchange="this.form.submit()">
              <option value="" {% if not filtro %}selected{% endif %}>
                Todos
              </option>
              <option value="1" {% if filtro=="1" %}selected{% endif %}>
                Activos
              </option>
              <option value="2" {% if filtro=="2" %}selected{% endif %}>
                Inactivos
              </option>
            </select>
          </form>

          <form class="entity-form" id="formPuestos" data-entity="Puestos"
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px">
            <div class="field">
              <label for="p-id-puesto">ID Puesto</label>
              <input type="number" id="p-id-puesto" name="id_puesto" placeholder="1" required />
            </div>
            <div class="field">
              <label for="p-nombre">Nombre</label>
              <input type="text" id="p-nombre" name="nombre" placeholder="Nombre del puesto" required />
            </div>
            <div class="field" style="grid-column: 1 / -1">
              <label for="p-descripcion">Descripción</label>
              <input type="text" id="p-descripcion" name="descripcion" placeholder="Descripción del puesto" />
            </div>
            <div class="field" style="grid-column: 1 / -1">
              <label for="p-estado">Estado</label>
              <input type="text" id="p-estado" name="estado" placeholder="Estado del puesto" />
            </div>
            <div class="form-actions" style="grid-column: 1 / -1">
              <button type="button" id="btnAgregarPuesto" class="btn btn--primary btn-agregar">
                Agregar
              </button>
              <button type="button" id="btnActualizarPuesto" class="btn btn--secondary btn-actualizar">
                Actualizar
              </button>
              <button type="button" id="btnDesactivarPuesto" class="btn-icon btn-delete">
                Desactivar
              </button>
            </div>
          </form>
        </div>

        <div class="table-wrap">
          <table class="data-table" data-entity="Puestos">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              {% for p in puestos %}
              <tr>
                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>{{ p[2] }}</td>
                <td>{{ p[3] }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const URL_API_PUESTOS = 'http://127.0.0.1:5001/api/puestos'

    function obtenerDatosPuesto() {
      return {
        id_puesto: parseInt(document.getElementById('p-id-puesto').value),
        nombre: document.getElementById('p-nombre').value,
        descripcion: document.getElementById('p-descripcion').value,
      }
    }

    document
      .getElementById('btnAgregarPuesto')
      .addEventListener('click', async () => {
        const datos = obtenerDatosPuesto()
        if (!datos.id_puesto || !datos.nombre)
          return alert('Llena al menos el ID y el Nombre.')
        try {
          const respuesta = await fetch(`${URL_API_PUESTOS}/guardar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
          })
          const resultado = await respuesta.json()
          alert(resultado.message)
          if (respuesta.ok) {
            document.getElementById('formPuestos').reset()
            location.reload()
          }
        } catch (error) {
          alert(
            'No se pudo conectar con el servidor de Flask en el puerto 5001.',
          )
        }
      })

    document
      .getElementById('btnActualizarPuesto')
      .addEventListener('click', async () => {
        const datos = obtenerDatosPuesto()
        if (!datos.id_puesto || !datos.nombre)
          return alert('Llena al menos el ID y el Nombre.')
        try {
          const respuesta = await fetch(`${URL_API_PUESTOS}/actualizar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
          })
          const resultado = await respuesta.json()
          alert(resultado.message)
          if (respuesta.ok) {
            document.getElementById('formPuestos').reset()
            location.reload()
          }
        } catch (error) {
          alert(
            'No se pudo conectar con el servidor de Flask en el puerto 5001.',
          )
        }
      })

    document
      .getElementById('btnDesactivarPuesto')
      .addEventListener('click', async () => {
        const datos = obtenerDatosPuesto()
        if (!datos.id_puesto)
          return alert('Especifica el ID del puesto a eliminar.')
        try {
          const respuesta = await fetch(
            `${URL_API_PUESTOS}/eliminar/${datos.id_puesto}`,
            {
              method: 'POST',
            },
          )
          const resultado = await respuesta.json()
          alert(resultado.message)
          if (respuesta.ok) {
            document.getElementById('formPuestos').reset()
            location.reload()
          }
        } catch (error) {
          alert(
            'No se pudo conectar con el servidor de Flask en el puerto 5001.',
          )
        }
      })
  </script>
</body>

</html>
