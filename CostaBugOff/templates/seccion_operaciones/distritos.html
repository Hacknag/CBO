<!doctype html>
<html lang="es">
{% include 'plantillas/_default_head.html' %}

<body>
  <header class="topbar">
    <div class="topbar__brand">
      {% include 'plantillas/_logo.html' %}
      <span class="topbar__view-tag" id="viewTag">Vista Distritos</span>
    </div>
    <div class="topbar__user" title="Usuario">A</div>
  </header>

  {% include 'plantillas/_navbar.html' %}
  <main class="app">
    <section class="panel active" id="panel-distritos" data-title="Distritos">
      <div class="panel__header">
        <h1>Distritos</h1>
      </div>
      <div class="panel__body">
        <div style="display:flex; flex-direction:column; gap:16px;">
          <form method="get" class="filtro-form">
            <label for="filtro-estado">Filtrar por estado:</label>
            <select name="estado" id="filtro-estado" onchange="this.form.submit()">
              <option value="" {% if not filtro %}selected{% endif %}>Todos</option>
              {% for e in estados %}
              <option value="{{ e[0] }}" {% if filtro==e[0]|string %}selected{% endif %}>{{ e[1] }}</option>
              {% endfor %}
            </select>
          </form>

          <form class="entity-form" id="formDistritos" data-entity="Distrito"
            style="display:grid; grid-template-columns: 1fr 1fr; gap: 0 16px;">
            <div class="field">
              <label for="dis-id">ID Distrito</label>
              <input type="number" id="dis-id" name="id_distrito" placeholder="1" required />
            </div>
            <div class="field">
              <label for="dis-nombre">Nombre</label>
              <input type="text" id="dis-nombre" name="nombre" placeholder="Nombre del distrito" required />
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label for="dis-estado">Estado</label>
              <select id="dis-estado" name="id_estado" required>
                <option value="">Selecciona un estado</option>
                {% for e in estados %}
                <option value="{{ e[0] }}">{{ e[1] }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-actions" style="grid-column: 1 / -1;">
              <button type="button" id="btnAgregarDistrito" class="btn btn--primary btn-agregar">Agregar</button>
              <button type="button" id="btnActualizarDistrito"
                class="btn btn--secondary btn-actualizar">Actualizar</button>
              <button type="button" id="btnDesactivarDistrito" class="btn-icon btn-delete">Desactivar</button>
            </div>
          </form>
        </div>

        <div class="table-wrap">
          <table class="data-table" data-entity="Distrito">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              {% for p in distritos %}
              <tr>
                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>{{ p[2] }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const URL_API_DISTRITOS = 'http://127.0.0.1:5001/api/distritos'

    function obtenerDatosDistrito() {
      return {
        id_distrito: parseInt(document.getElementById('dis-id').value),
        nombre: document.getElementById('dis-nombre').value,
        id_estado: parseInt(document.getElementById('dis-estado').value),
      }
    }

    document.getElementById('btnAgregarDistrito').addEventListener('click', async () => {
      const datos = obtenerDatosDistrito()
      if (!datos.id_distrito || !datos.nombre || !datos.id_estado)
        return alert('Llena ID, Nombre y Estado.')
      try {
        const respuesta = await fetch(`${URL_API_DISTRITOS}/guardar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        })
        const resultado = await respuesta.json()
        alert(resultado.message)
        if (respuesta.ok) {
          document.getElementById('formDistritos').reset()
          location.reload()
        }
      } catch (error) {
        alert('No se pudo conectar con el servidor de Flask en el puerto 5001.')
      }
    })

    document.getElementById('btnActualizarDistrito').addEventListener('click', async () => {
      const datos = obtenerDatosDistrito()
      if (!datos.id_distrito || !datos.nombre || !datos.id_estado)
        return alert('Llena ID, Nombre y Estado antes de actualizar.')
      try {
        const respuesta = await fetch(`${URL_API_DISTRITOS}/actualizar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        })
        const resultado = await respuesta.json()
        alert(resultado.message)
        if (respuesta.ok) {
          document.getElementById('formDistritos').reset()
          location.reload()
        }
      } catch (error) {
        alert('No se pudo conectar con el servidor de Flask en el puerto 5001.')
      }
    })

    document.getElementById('btnDesactivarDistrito').addEventListener('click', async () => {
      const datos = obtenerDatosDistrito()
      if (!datos.id_distrito)
        return alert('Especifica el ID de la distrito a desactivar.')
      try {
        const respuesta = await fetch(`${URL_API_DISTRITOS}/eliminar/${datos.id_distrito}`, {
          method: 'POST',
        })
        const resultado = await respuesta.json()
        alert(resultado.message)
        if (respuesta.ok) {
          document.getElementById('formDistritos').reset()
          location.reload()
        }
      } catch (error) {
        alert('No se pudo conectar con el servidor de Flask en el puerto 5001.')
      }
    })
  </script>

  {% include 'plantillas/_default_scripts.html' %}
</body>

</html>
