<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CostaBugOff</title>
</head>

<body>
  <header class="topbar">
    <div class="topbar__brand">
      <div class="JeremyLogo">
        <link rel="stylesheet" href="/static/css/styles.css" alt="foto Jeremy" />
      </div>

      <img class="logo-bug" src="/static/img/Jeremy.png" alt="" />
      <span class="topbar__logo">CostaBugOff</span>

      <span class="topbar__view-tag" id="viewTag">Vista Servicios Realizados</span>
    </div>
    <div class="topbar__user" title="Usuario">A</div>
  </header>

  {% include 'plantillas/_navbar.html' %}

  <main class="app">
    <section class="panel active" id="panel-serviciosr" data-title="Servicios Realizados">
      <div class="panel__header">
        <h1>Servicios Realizados</h1>
      </div>
      <div class="panel__body">
        <div style="display:flex; flex-direction:column; gap:16px;">
          <form method="get" class="filtro-form">
            <label for="filtro-estado">Filtrar por estado:</label>
            <select name="estado" id="filtro-estado" onchange="this.form.submit()">
              <option value="" {% if not filtro %}selected{% endif %}>Todos</option>
              {% for e in estados %}
              <option value="{{ e[0] }}" {% if filtro==e[0]|string %}selected{% endif %}>{{ e[1] }}</option>
              {% endfor %}
            </select>
          </form>

          <form class="entity-form" id="formServiciosR" data-entity="ServicioRealizado"
            style="display:grid; grid-template-columns: 1fr 1fr; gap: 0 16px;">
            <div class="field">
              <label for="ser-id">ID Servicio</label>
              <input type="number" id="ser-id" name="id_servicio_realizado" placeholder="1" required />
            </div>
            <div class="field">
              <label for="ser-ubicacion">Ubicación</label>
              <input type="text" id="ser-ubicacion" name="ubicacion" placeholder="Ubicación del servicio" required />
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label for="ser-informe">Informe</label>
              <input type="text" id="ser-informe" name="informe" placeholder="Informe del servicio" />
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label for="ser-estado">Estado</label>
              <select id="ser-estado" name="id_estado" required>
                <option value="">Selecciona un estado</option>
                {% for e in estados %}
                <option value="{{ e[0] }}">{{ e[1] }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-actions" style="grid-column: 1 / -1;">
              <button type="button" id="btnAgregarServicio" class="btn btn--primary btn-agregar">
                Agregar
              </button>
              <button type="button" id="btnActualizarServicio" class="btn btn--secondary btn-actualizar">
                Actualizar
              </button>
            </div>
          </form>
        </div>

        <div class="table-wrap">
          <table class="data-table" data-entity="ServicioRealizado">
            <thead>
              <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Ubicación</th>
                <th>Informe</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              {% for s in serviciosr %}
              <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ s[2] }}</td>
                <td>{{ s[3] }}</td>
                <td>{{ s[5] }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const URL_API_SERVICIOSR = 'http://127.0.0.1:5001/api/serviciosr'

    function obtenerDatosServicio() {
      return {
        id_servicio_realizado: parseInt(document.getElementById('ser-id').value),
        ubicacion: document.getElementById('ser-ubicacion').value,
        informe: document.getElementById('ser-informe').value,
        id_estado: parseInt(document.getElementById('ser-estado').value),
      }
    }

    document.getElementById('btnAgregarServicio').addEventListener('click', async () => {
      const datos = obtenerDatosServicio()
      if (!datos.id_servicio_realizado || !datos.ubicacion || !datos.id_estado)
        return alert('Llena ID, Ubicación y Estado.')
      try {
        const respuesta = await fetch(`${URL_API_SERVICIOSR}/guardar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        })
        const resultado = await respuesta.json()
        alert(resultado.message)
        if (respuesta.ok) {
          document.getElementById('formServiciosR').reset()
          location.reload()
        }
      } catch (error) {
        alert('No se pudo conectar con el servidor de Flask en el puerto 5001.')
      }
    })

    document.getElementById('btnActualizarServicio').addEventListener('click', async () => {
      const datos = obtenerDatosServicio()
      if (!datos.id_servicio_realizado || !datos.ubicacion || !datos.id_estado)
        return alert('Llena ID, Ubicación y Estado antes de actualizar.')
      try {
        const respuesta = await fetch(`${URL_API_SERVICIOSR}/actualizar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        })
        const resultado = await respuesta.json()
        alert(resultado.message)
        if (respuesta.ok) {
          document.getElementById('formServiciosR').reset()
          location.reload()
        }
      } catch (error) {
        alert('No se pudo conectar con el servidor de Flask en el puerto 5001.')
      }
    })
  </script>
</body>

</html>
