<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CostaBugOff - Ingresar</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <img class="logo-bug" src="/static/img/Jeremy.png" alt="CostaBugOff" />
        <span class="topbar__logo">CostaBugOff</span>
        <span class="topbar__view-tag">Iniciar sesión</span>
      </div>
    </header>

    <main class="app" style="display:flex; justify-content:center;">
      <section style="max-width:380px; width:100%; margin-top:40px;">
        <div class="panel__header">
          <h1>Ingresar</h1>
        </div>

        {% if error %}
        <p style="color:var(--brick); font-size:13.5px;">{{ error }}</p>
        {% endif %}

        <form class="entity-form" method="POST" action="/login">
          <div class="field">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="correo@costabugoff.com"
              required
              autofocus
            />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Contraseña"
              required
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary">Ingresar</button>
          </div>
        </form>

        <div style="margin-top:16px; display:flex; justify-content:space-between; font-size:13.5px;">
          <a href="/registro">Registrarse</a>
          <a href="/olvide-password">¿Olvidaste tu contraseña?</a>
        </div>
      </section>
    </main>
  </body>
</html>
